<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FB Comment Checker</title>
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #1877f2;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 13px;
      color: #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #1877f2;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #1877f2;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button:hover {
      background-color: #166fe5;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    button.stop-btn {
      background-color: #dc3545;
    }

    button.stop-btn:hover {
      background-color: #c82333;
    }

    button.settings-btn {
      background-color: #6c757d;
    }

    button.settings-btn:hover {
      background-color: #5a6268;
    }

    #result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }

    .success {
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }

    .error {
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }

    .info {
      background-color: #d1ecf1;
      border: 1px solid #bee5eb;
      color: #0c5460;
    }

    .monitoring-status {
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
      display: none;
    }

    .monitoring-status.active {
      display: block;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .monitoring-status .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #00ff00;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    .winner-info {
      margin-top: 10px;
      padding: 10px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .winner-info strong {
      color: #1877f2;
    }

    .winner-info a {
      color: #1877f2;
      text-decoration: none;
    }

    .winner-info a:hover {
      text-decoration: underline;
    }

    .instructions {
      font-size: 12px;
      color: #666;
      margin-bottom: 15px;
      padding: 10px;
      background-color: #f7f7f7;
      border-radius: 4px;
    }

    #monitoringSection {
      display: block;
    }

    #monitoringSection.hidden {
      display: none;
    }

    #stopSection {
      display: none;
    }

    #stopSection.active {
      display: block;
    }
  </style>
</head>
<body>
  <h1>FB Comment Checker</h1>

  <div class="monitoring-status" id="monitoringStatus">
    <span class="pulse"></span>
    <strong>Monitoring Active</strong>
    <div style="font-size: 12px; margin-top: 5px;">
      Watching for: "<span id="currentAnswer"></span>"
    </div>
  </div>

  <div class="instructions">
    Navigate to a Facebook post, enter the correct answer below, then click "Start Monitoring". The extension will check all existing comments first, then watch for new ones in real-time.
  </div>

  <div id="monitoringSection">
    <div class="input-group">
      <label for="correctAnswer">Correct Answer:</label>
      <input type="text" id="correctAnswer" placeholder="Enter the correct answer">
    </div>

    <button id="startBtn">Start Monitoring</button>
  </div>

  <div id="stopSection">
    <button id="stopBtn" class="stop-btn">Stop Monitoring</button>
  </div>

  <button id="settingsBtn" class="settings-btn">Settings</button>

  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
